name: Release

# Pushing a tag such as v0.1.0 releases that commit. See RELEASING.md for the
# one-time setup this needs.
#
# Two jobs, so that no third-party build code ever runs alongside the signing key:
#   build    no secrets. Checks the tag is on main, runs every test, and stages
#            unsigned artifacts.
#   publish  the protected maven-central environment. Signs the staged files with
#            gpg and uploads them to the Sonatype Central Portal. It runs no Gradle
#            and checks out no code.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      manifest-sha256: ${{ steps.stage.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Derive the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.?[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install --require-hashes --only-binary=":all:" -r tools/differential/requirements.txt
          mkdir -p build/differential
          python -I tools/differential/generate.py --seed 1 --count 5000 --out build/differential/release.json
          ./gradlew build testOnJava11 differentialTest \
            -Pversion="$VERSION" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 \
            -Pdifferential.cases=build/differential/release.json --console=plain

      - name: Stage unsigned artifacts
        id: stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf build/staging-deploy
          ./gradlew publishMavenPublicationToStagingRepository -Pversion="$VERSION" -Punsigned --console=plain
          # A checksum manifest, whose own digest travels as a job output rather than
          # through the artifact store, so publish can detect tampering in between.
          (cd build/staging-deploy && find dev -type f | LC_ALL=C sort | xargs sha256sum) > staging-manifest.txt
          mv staging-manifest.txt build/staging-deploy/
          cat build/staging-deploy/staging-manifest.txt
          echo "manifest-sha256=$(sha256sum build/staging-deploy/staging-manifest.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-deploy
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Protect this environment (required reviewers, tags v* only) in the repository
    # settings. The publishing secrets live on it, not on the repository.
    environment: maven-central
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-deploy
          path: staging-deploy

      - name: Verify the staged files
        working-directory: staging-deploy
        env:
          EXPECTED: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          echo "$EXPECTED  staging-manifest.txt" | sha256sum --check --strict
          sha256sum --check --strict staging-manifest.txt
          # Nothing beyond what the manifest lists may be signed or uploaded.
          diff <(find dev -type f | LC_ALL=C sort) <(cut -d' ' -f3- staging-manifest.txt)
          rm staging-manifest.txt

      - name: Sign
        working-directory: staging-deploy
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          KEY_ARGS=()
          if [ -n "$SIGNING_KEY_ID" ]; then KEY_ARGS=(--local-user "$SIGNING_KEY_ID"); fi
          find dev -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' \
            ! -name 'maven-metadata.xml*' -print0 |
            while IFS= read -r -d '' file; do
              printf '%s' "$SIGNING_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                "${KEY_ARGS[@]}" --armor --detach-sign "$file"
              gpg --batch --verify "$file.asc" "$file"
            done
          rm -rf "$GNUPGHOME"

      - name: Bundle
        working-directory: staging-deploy
        run: |
          zip -r ../central-bundle.zip dev -x '*/maven-metadata.xml*'
          unzip -l ../central-bundle.zip

      - name: Upload to the Central Portal
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # USER_MANAGED: the upload is validated, then waits for someone to press "Publish"
          # at https://central.sonatype.com/publishing. Set the repository variable
          # CENTRAL_PUBLISHING_TYPE=AUTOMATIC to publish without that step.
          PUBLISHING_TYPE: ${{ vars.CENTRAL_PUBLISHING_TYPE || 'USER_MANAGED' }}
        run: |
          TOKEN="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          echo "::add-mask::$TOKEN"
          # Pass the header through a config on stdin so it never appears on a command line.
          auth() { printf 'header = "Authorization: Bearer %s"\n' "$TOKEN"; }
          if ! DEPLOYMENT_ID="$(auth | curl --config - --fail-with-body -sS -X POST \
            -F "bundle=@central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=python-packaging-$VERSION&publishingType=$PUBLISHING_TYPE")"; then
            echo "::error::Upload failed: $DEPLOYMENT_ID"
            exit 1
          fi
          echo "Deployment: $DEPLOYMENT_ID"
          for _ in $(seq 1 60); do
            STATUS="$(auth | curl --config - --fail-with-body -sS -X POST \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            STATE="$(jq -r .deploymentState <<<"$STATUS")"
            echo "State: $STATE"
            case "$STATE" in
              VALIDATED) echo "::notice::Validated. Publish it at https://central.sonatype.com/publishing"; exit 0 ;;
              PUBLISHING|PUBLISHED) echo "::notice::$STATE"; exit 0 ;;
              FAILED) echo "$STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for validation"; exit 1

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle-${{ needs.build.outputs.version }}
          path: central-bundle.zip
