name: Release

# Pushing a tag such as v0.1.0 builds, verifies, signs and uploads the release to the
# Sonatype Central Portal. See RELEASING.md for the one-time setup this needs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Protect this environment (required reviewers) in the repository settings; the
    # publishing secrets live on it, not on the repository.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-QUALIFIER]"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify
        run: |
          python -m pip install --require-hashes --only-binary=":all:" -r tools/differential/requirements.txt
          mkdir -p build/differential
          python -I tools/differential/generate.py --seed 1 --count 5000 --out build/differential/release.json
          ./gradlew build testOnJava11 differentialTest \
            -Pversion="$VERSION" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 \
            -Pdifferential.cases=build/differential/release.json --console=plain

      - name: Stage signed artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: ./gradlew publishMavenPublicationToStagingRepository -Pversion="$VERSION" --console=plain

      - name: Bundle
        run: |
          cd build/staging-deploy
          zip -r ../central-bundle.zip dev -x '*/maven-metadata.xml*'
          unzip -l ../central-bundle.zip

      - name: Upload to the Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # USER_MANAGED: the upload is validated, then waits for someone to press "Publish"
          # at https://central.sonatype.com/publishing. Set the repository variable
          # CENTRAL_PUBLISHING_TYPE=AUTOMATIC to publish without that step.
          PUBLISHING_TYPE: ${{ vars.CENTRAL_PUBLISHING_TYPE || 'USER_MANAGED' }}
        run: |
          TOKEN="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"
          if ! DEPLOYMENT_ID="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=python-packaging-$VERSION&publishingType=$PUBLISHING_TYPE")"; then
            echo "::error::Upload failed: $DEPLOYMENT_ID"
            exit 1
          fi
          echo "Deployment: $DEPLOYMENT_ID"
          for _ in $(seq 1 60); do
            STATE="$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" | jq -r .deploymentState)"
            echo "State: $STATE"
            case "$STATE" in
              VALIDATED) echo "::notice::Validated. Publish it at https://central.sonatype.com/publishing"; exit 0 ;;
              PUBLISHING|PUBLISHED) echo "::notice::$STATE"; exit 0 ;;
              FAILED) curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
                        "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for validation"; exit 1

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle-${{ env.VERSION }}
          path: build/central-bundle.zip
